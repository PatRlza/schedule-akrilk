name: Синхронизация расписания с Яндекс.Диска

on:
  schedule:
    # Проверяет обе папки на Яндекс.Диске (СПО и ВО) каждые 15 минут.
    # GitHub не гарантирует запуск ровно по расписанию (может быть с
    # задержкой в несколько минут при высокой нагрузке) — это нормально.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}   # позволяет зарпустить вручную кнопкой "Run workflow"

permissions:
  contents: write   # нужно, чтобы workflow мог закоммитить обновлённый файл

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Проверить Яндекс.Диск (СПО и ВО) и скачать новые файлы
        id: sync
        run: python3 .github/scripts/sync_yandex.py

      - name: Закоммитить изменения
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "schedule-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- spo/ vo/
          if git diff --staged --quiet; then
            echo "Скрипт сообщил об изменениях, но в git ничего не застейджилось — пропускаю коммит."
          else
            git commit -m "Обновление расписания с Яндекс.Диска (СПО/ВО)"
            git push
          fi
